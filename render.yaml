services:
  - type: web
    name: football-edge-pro
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATA_PROVIDER
        value: demo
      - key: SPORTMONKS_API_TOKEN
        sync: false
      - key: API_FOOTBALL_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
